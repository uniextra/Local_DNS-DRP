name: Publish multi-architecture Docker image to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-publish-${{ github.ref }}
  # Do not cancel an in-flight publish when another main push arrives.
  # Let the current image finish; GitHub will keep the latest pending run.
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish amd64/arm64 image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Run Go tests
        run: go test -race -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/local-dns-drp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image architectures and entrypoint
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/local-dns-drp:latest
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "Checking ${platform} image..."
            docker pull --platform "${platform}" "${IMAGE}"
            architecture="$(docker image inspect --format '{{.Architecture}}' "${IMAGE}")"
            entrypoint="$(docker image inspect --format '{{json .Config.Entrypoint}}' "${IMAGE}")"
            expected_arch="${platform#linux/}"
            if [[ "${architecture}" != "${expected_arch}" ]]; then
              echo "Unexpected architecture: ${architecture}; expected ${expected_arch}"
              exit 1
            fi
            if [[ "${entrypoint}" != '["/usr/local/bin/adguard-dns-monitor"]' ]]; then
              echo "Unexpected image entrypoint: ${entrypoint}"
              exit 1
            fi
            echo "Verified ${platform}: ${entrypoint}"
          done
