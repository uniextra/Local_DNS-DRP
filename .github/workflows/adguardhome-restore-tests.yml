name: Adguardhome-DRP Go tests

on:
  push:
    paths:
      - "*.go"
      - "go.mod"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/adguardhome-restore-tests.yml"
  pull_request:
    paths:
      - "*.go"
      - "go.mod"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/adguardhome-restore-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -v ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/adguard-dns-monitor .
