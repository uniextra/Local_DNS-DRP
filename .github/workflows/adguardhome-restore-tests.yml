name: AdGuardHome-Restore Go tests

on:
  push:
    paths:
      - "AdguardHome-Restore/**"
      - ".github/workflows/adguardhome-restore-tests.yml"
  pull_request:
    paths:
      - "AdguardHome-Restore/**"
      - ".github/workflows/adguardhome-restore-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AdguardHome-Restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Unit tests
        run: go test -v ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/adguard-dns-monitor .
