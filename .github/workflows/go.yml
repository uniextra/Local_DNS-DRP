name: Go CI

on:
  push:
    paths:
      - "*.go"
      - "go.mod"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "*.go"
      - "go.mod"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  test:
    name: Format, test, vet and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l *.go)"
          if [[ -n "$files" ]]; then
            echo "The following Go files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Static analysis
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/local-dns-drp .
