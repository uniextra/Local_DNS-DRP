name: Go CI

on:
  push:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  test:
    name: Format, test, vet and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following Go files need gofmt:"
            echo "$files"
            while IFS= read -r file; do
              gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi

      - name: Unit tests
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        shell: bash
        run: |
          go tool cover -func=coverage.out | tail -n 1
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          if awk "BEGIN {exit !($total < 65)}"; then
            echo "Coverage ${total}% is below the 65% threshold"
            exit 1
          fi

      - name: Static analysis
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/local-dns-drp ./cmd/dns-monitor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify amd64 and arm64 Docker builds
        run: docker buildx build --platform linux/amd64,linux/arm64 --output=type=oci,dest=/tmp/local-dns-drp-oci.tar .
