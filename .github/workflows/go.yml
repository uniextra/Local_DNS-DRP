name: Go

on:
  push:
    paths:
      - "*.go"
      - "go.mod"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "*.go"
      - "go.mod"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/go.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Unit tests
        run: go test ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/adguard-dns-monitor .
