name: Verify Codex co-author hook

on:
  push:
    paths:
      - ".githooks/**"
      - "scripts/setup-codex-attribution.sh"
      - ".github/workflows/verify-codex-coauthor.yml"
  pull_request:
    paths:
      - ".githooks/**"
      - "scripts/setup-codex-attribution.sh"
      - ".github/workflows/verify-codex-coauthor.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify hook appends the official Codex co-author trailer
        run: |
          bash -n .githooks/prepare-commit-msg scripts/setup-codex-attribution.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git -C "$tmp" init -q
          git -C "$tmp" config user.name "Test Author"
          git -C "$tmp" config user.email "test@example.com"
          git -C "$tmp" config ai.coauthor "Codex <noreply@openai.com>"
          git -C "$tmp" config core.hooksPath "$GITHUB_WORKSPACE/.githooks"
          printf 'test\n' > "$tmp/test.txt"
          git -C "$tmp" add test.txt
          git -C "$tmp" commit -m "test: verify Codex co-author" -q
          git -C "$tmp" show -s --format=%B HEAD | grep -Fx 'Co-authored-by: Codex <noreply@openai.com>'
