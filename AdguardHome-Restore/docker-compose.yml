services:
  adguard-dns-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adguard-dns-monitor
    restart: unless-stopped
    environment:
      # DNS targets: comma-separated name=IP[:port] entries
      TARGETS: "adguard-home=192.168.1.2,adguard-backup=192.168.1.3"
      TELEGRAM_BOT_TOKEN: "123456789:REPLACE_WITH_YOUR_BOT_TOKEN"
      TELEGRAM_CHAT_ID: "123456789"
      CHECK_INTERVAL: "60"
      DNS_TIMEOUT: "3"
      DNS_TEST_DOMAIN: "google.com"
      TELEGRAM_TIMEOUT: "10"
      # Optional automatic recovery: leave ROUTER_PASSWORD empty to disable.
      ROUTER_URL: "${ROUTER_URL:-http://192.168.1.1}"
      ROUTER_USERNAME: "${ROUTER_USERNAME:-1234}"
      ROUTER_PASSWORD: "${ROUTER_PASSWORD:-}"
      DNS_PRIMARY: "${DNS_PRIMARY:-1.1.1.1}"
      DNS_SECONDARY: "${DNS_SECONDARY:-8.8.8.8}"
      WIFI_OFF_SECONDS: "${WIFI_OFF_SECONDS:-10}"
      RECOVERY_COOLDOWN: "${RECOVERY_COOLDOWN:-900}"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
