services:
  adguard-dns-monitor:
    image: uniextra/local-dns-drp:latest
    pull_policy: always
    container_name: adguard-dns-monitor
    restart: unless-stopped
    environment:
      # DNS targets: comma-separated name=IP[:port] entries
      TARGETS: "adguard-home=192.168.1.2,adguard-backup=192.168.1.3"

      # Credentials are read from mounted secret files, not Compose literals.
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id

      # DNS monitor
      CHECK_INTERVAL: "60"
      DNS_TIMEOUT: "3"
      DNS_TEST_DOMAIN: "google.com"
      TELEGRAM_TIMEOUT: "10"

      # Optional automatic recovery for Askey RTF8316VW
      ROUTER_URL: "http://192.168.1.1"
      ROUTER_USERNAME: "1234"
      ROUTER_PASSWORD_FILE: /run/secrets/router_password
      DNS_PRIMARY: "1.1.1.1"
      DNS_SECONDARY: "8.8.8.8"
      WIFI_OFF_SECONDS: "10"
      RECOVERY_COOLDOWN: "900"
    secrets:
      - telegram_bot_token
      - telegram_chat_id
      - router_password
    dns:
      - 1.1.1.1
      - 8.8.8.8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_chat_id:
    file: ./secrets/telegram_chat_id.txt
  router_password:
    file: ./secrets/router_password.txt
